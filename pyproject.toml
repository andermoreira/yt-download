# Tooling config only — this project ships as a single script with no build step.

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E501 (line length) is intentionally left out; keep the pyupgrade (UP) and
# import-sorting (I) rules the source already follows, plus the defaults.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
